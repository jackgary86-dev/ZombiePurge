name: Deploy live demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build for GitHub Pages
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          BUILD_HASH: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # K5: also mirrors this same build onto the gh-pages branch's root, alongside
      # any open PRs' pr-<number>/ previews (preview.yml). Purely additive - the live
      # site above keeps deploying via actions/deploy-pages regardless, so this has
      # no effect until Pages' source is switched to "Deploy from a branch: gh-pages".
      - name: Mirror to gh-pages branch root
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/gh-pages-publish.sh "" dist "Mirror main @ ${{ github.sha }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
